# Netlify deploy config for the astoria Astro app (pnpm monorepo).
# Build from the repo root (no `base`) and copy the @astrojs/netlify adapter
# output (.netlify/v1: SSR function, edge middleware, config) to the repo root,
# because Netlify reads the Frameworks API build output from the build's working
# directory (the repo root), not from a subdirectory. publish points at the
# app's static client assets. DEPLOY_TARGET switches astro.config to the Netlify
# adapter (the Node adapter stays the default for local/Docker). Storyblok env
# vars are set as site environment variables.
[build]
  command = "pnpm --filter astoria build:prod && rm -rf .netlify && cp -R packages/apps/astoria/.netlify .netlify"
  publish = "packages/apps/astoria/dist"

[build.environment]
  NODE_VERSION = "24"
  DEPLOY_TARGET = "netlify"
  MODE = "production"

# Keep this hackathon preview out of all search engines, on every response
# (static assets and SSR function output alike).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
